<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>今日打卡</title><link rel="stylesheet" href="demo.css"></head><body>
<main><div class="top"><span>✿ &nbsp; 今日打卡</span><small>演示版</small></div><section class="card"><div class="character"><div class="halo"></div><div id="scene" role="img" aria-label="栗棕长发、杏桃山茶花和服的原创Q版少女"><p class="loading">准备中…</p></div><button id="preview-bow" aria-label="预览鞠躬动画">你好呀！ ♡</button></div><div class="controls"><div class="clock"><time id="clock-time">09:00</time><span id="clock-seconds">00</span></div><p id="date" class="date"></p><label for="employee">选择员工</label><div class="employee-picker"><span id="avatar">林</span><select id="employee"><option value="林小春">林小春 · 运营部</option><option value="陈知夏">陈知夏 · 设计部</option><option value="周一禾">周一禾 · 门店服务</option></select></div><div class="shift"><span>09:00 — 18:00</span><span id="status">待签到</span></div><button id="check" class="primary"><span>签到上班</span><span>→</span></button><p id="feedback" role="status" aria-live="polite">今天也加油！</p></div></section><p class="note">仅供体验，不计入正式考勤</p></main>
<dialog id="success" aria-labelledby="success-title"><button id="close-modal" aria-label="关闭">×</button><div id="modal-scene"></div><h2 id="success-title">签到成功！</h2><p id="success-detail"></p><p class="thanks">今天也加油！</p><button id="continue" class="primary">好哒 <span>♡</span></button><button id="replay">再看一次</button></dialog><script type="module" src="demo.js"></script></body></html>
