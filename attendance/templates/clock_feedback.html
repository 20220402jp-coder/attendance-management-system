<link rel="stylesheet" href="/static/themes/feedback.css?v=1">
<dialog id="success" class="feedback-dialog feedback-{{ clock_boot.theme }}" aria-labelledby="success-title"><button id="close-modal" aria-label="{{ _('appearance.close') }}">×</button><div id="modal-scene" class="feedback-art" aria-label="{{ design.animation }}"><div class="motif"><span class="motif-symbol">{{ design.mark }}</span><svg class="success-tick" viewBox="0 0 80 80" aria-hidden="true"><path d="M20 42 L34 56 L62 25"/></svg></div>{% for i in range(12) %}<i style="--i:{{ i }}" aria-hidden="true"></i>{% endfor %}</div><h2 id="success-title"></h2><p id="success-detail"></p><p class="thanks"></p><button id="continue">OK &nbsp; ✓</button><button id="replay" aria-label="{{ _('appearance.replay') }}">↻</button></dialog>
