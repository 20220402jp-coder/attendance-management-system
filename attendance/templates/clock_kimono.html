<!doctype html><html lang="{{ current_lang }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ _('app.title') }}</title><link rel="stylesheet" href="/static/themes/kimono.css?v=1"></head><body>
<main><div class="top"><span>✿ &nbsp; {{ _('nav.clock') }}</span><a href="/schedule/" style="color:inherit;font-size:12px">{{ _('nav.preferences') }}</a></div><section class="card"><div class="character"><div class="halo"></div><div id="scene" role="img" aria-label="和服卡通人物"><p class="loading">…</p></div><button id="preview-bow" aria-label="预览鞠躬动画">♡</button></div><div class="controls"><div class="clock"><time id="clock-time">--:--</time><span id="clock-seconds"></span></div><p id="date" class="date"></p><label for="employee-select">{{ _('stats.employee') }}</label><div class="employee-picker"><span id="avatar">·</span><select id="employee-select"><option value="">{{ _('stats.employee') }}…</option>{% for emp in employees %}<option value="{{ emp.employee_id }}" data-name="{{ emp.name }}" data-dept="{{ emp.department }}">{{ emp.name }} · {{ emp.department }}</option>{% endfor %}</select></div>{% if not employees %}<p class="note">{{ _('home.no_employees') }} <a href="/admin/employees">{{ _('home.add_employee') }}</a></p>{% endif %}<div class="shift"><span id="schedule-text">—</span><span id="status">—</span></div><button id="clock-btn" class="primary" disabled><span>…</span><span>→</span></button><p id="clock-result" role="status" aria-live="polite" style="font-size:12px;min-height:20px;text-align:center"></p></div></section><p class="note">{% for code,label in langs %}<a href="?lang={{ code }}" style="color:inherit;margin:0 6px">{{ label }}</a>{% endfor %}</p></main>
<dialog id="success" aria-labelledby="success-title"><button id="close-modal" aria-label="关闭">×</button><div id="modal-scene"></div><h2 id="success-title"></h2><p id="success-detail"></p><p class="thanks"></p><button id="continue" class="primary">OK <span>♡</span></button><button id="replay">↻</button></dialog><script id="clock-boot" type="application/json">{{ clock_boot|tojson }}</script><script type="module" src="/static/themes/clock.js?v=1"></script></body></html>
