{% extends "base.html" %}
{% block head %}
<style>
.att-page { max-width: 500px; margin: 0 auto; }
.att-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 28px;
    box-shadow: var(--shadow);
}
.att-card h2 { margin-bottom: 20px; font-size: 1.1rem; }
.form-group { margin-bottom: 16px; }
.form-group label {
    display: block;
    font-size: 0.85rem;
    color: var(--text-secondary);
    margin-bottom: 4px;
    font-weight: 500;
}
.form-group select,
.form-group input[type="date"],
.form-group input[type="time"] {
    width: 100%;
    padding: 10px 14px;
    border: 2px solid var(--border);
    border-radius: 10px;
    font-size: 1rem;
    font-family: inherit;
    transition: border-color 0.15s;
}
.form-group select:focus,
.form-group input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-glow);
}
.time-row {
    display: flex;
    gap: 12px;
}
.time-row .form-group { flex: 1; }
.att-card .save-btn {
    width: 100%;
    padding: 14px;
    font-size: 1.05rem;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
    background: linear-gradient(135deg, var(--primary), #8b5cf6);
    color: white;
    box-shadow: 0 4px 20px var(--primary-glow);
    transition: all 0.2s;
    margin-top: 8px;
}
.att-card .save-btn:hover { box-shadow: 0 8px 30px var(--primary-glow); transform: translateY(-1px); }
.att-card .save-btn:active { transform: scale(0.97); }
.att-card .save-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.leave-toggle {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 16px 0;
    padding: 12px 16px;
    background: #fffbeb;
    border: 2px solid #fcd34d;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s;
}
.leave-toggle:hover { border-color: #f59e0b; }
.leave-toggle.active {
    background: #fef3c7;
    border-color: #f59e0b;
}
.leave-toggle input { width: 18px; height: 18px; cursor: pointer; }
.leave-toggle label { cursor: pointer; font-weight: 600; color: #92400e; }
.leave-toggle .hint { font-size: 0.8rem; color: #b45309; margin-left: auto; }
.att-status {
    text-align: center;
    padding: 20px;
    font-size: 0.95rem;
    margin: 16px 0 0;
    border-radius: 10px;
}
.att-status.ok { background: #f0fdf4; color: #065f46; }
.att-status.err { background: #fef2f2; color: #991b1b; }
.att-status.info { background: #eff6ff; color: #1e40af; }
.att-status.loading { background: #f8fafc; color: var(--text-secondary); }
</style>
{% endblock %}

{% block content %}
<div class="att-page">
    <h1 style="margin-bottom:8px;">📝 打卡记录修正</h1>
    <p style="color:var(--text-secondary);font-size:0.85rem;margin-bottom:20px;">
        选择员工和日期，手动补签或修改签到/签退时间。
    </p>

    <div class="att-card">
        <h2>✏️ 修改打卡记录</h2>

        <div class="form-group">
            <label>员工</label>
            <select id="sel-emp">
                <option value="">— 请选择 —</option>
                {% for emp in employees %}
                <option value="{{ emp.employee_id }}">{{ emp.name }} · {{ emp.department }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label>日期</label>
            <input type="date" id="sel-date">
        </div>

        <button class="btn btn-primary" onclick="onFieldChange()" style="width:100%;justify-content:center;margin-bottom:16px;">🔍 查询</button>

        <div class="time-row" id="time-row">
            <div class="form-group">
                <label>签到时间</label>
                <input type="time" id="input-ci">
            </div>
            <div class="form-group">
                <label>签退时间</label>
                <input type="time" id="input-co">
            </div>
        </div>

        <div class="leave-toggle" id="leave-toggle" onclick="toggleLeave(event)">
            <input type="checkbox" id="input-leave">
            <label>🛌 标记为请假</label>
            <span class="hint">不计考勤，状态显示「请假」</span>
        </div>

        <div id="status-area"></div>

        <button class="save-btn" id="save-btn" onclick="doSave()" disabled>💾 保存</button>
    </div>
</div>

<script>
let _currentRecordId = null;
let _currentStatus = '';

function toggleLeave(event) {
    if (event && event.target && event.target.id === 'input-leave') {
        // Checkbox itself was clicked — native click already toggled it
        updateLeaveUI();
    } else {
        // Clicked on the label/container — manually toggle
        const cb = document.getElementById('input-leave');
        cb.checked = !cb.checked;
        updateLeaveUI();
    }
}

function updateLeaveUI() {
    const checked = document.getElementById('input-leave').checked;
    const toggle = document.getElementById('leave-toggle');
    toggle.classList.toggle('active', checked);
    // Disable time inputs when leave is checked
    document.getElementById('input-ci').disabled = checked;
    document.getElementById('input-co').disabled = checked;
    if (checked) {
        document.getElementById('input-ci').value = '';
        document.getElementById('input-co').value = '';
    }
}

function onFieldChange() {
    const empId = document.getElementById('sel-emp').value;
    const date = document.getElementById('sel-date').value;
    const statusArea = document.getElementById('status-area');
    const saveBtn = document.getElementById('save-btn');

    if (!empId || !date) {
        statusArea.innerHTML = '';
        saveBtn.disabled = true;
        return;
    }

    statusArea.innerHTML = '<div class="att-status loading">⏳ 查询中...</div>';
    saveBtn.disabled = true;
    _currentRecordId = null;

    // Clear old state
    document.getElementById('input-ci').value = '';
    document.getElementById('input-co').value = '';
    document.getElementById('input-ci').disabled = false;
    document.getElementById('input-co').disabled = false;
    document.getElementById('input-leave').checked = false;
    document.getElementById('leave-toggle').classList.remove('active');

    fetch('/api/attendance/records', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({employee_id: empId, start_date: date, end_date: date}),
    })
    .then(r => r.json())
    .then(data => {
        if (!data.ok) {
            statusArea.innerHTML = '<div class="att-status err">❌ ' + data.msg + '</div>';
            return;
        }

        if (data.records.length > 0) {
            // Record exists
            const rec = data.records[0];
            _currentRecordId = rec.id;
            _currentStatus = rec.status || '';
            if (rec.check_in) document.getElementById('input-ci').value = rec.check_in.slice(0,5);
            if (rec.check_out) document.getElementById('input-co').value = rec.check_out.slice(0,5);

            // If already marked as leave, check the leave toggle
            if (rec.status === 'leave') {
                document.getElementById('input-leave').checked = true;
                updateLeaveUI();
            }

            const statusLabels = {
                'normal': '正常 ✅',
                'late': '迟到 ⚠️',
                'early_leave': '早退 ⚠️',
                'both': '迟到+早退 ❌',
                'absent': '缺勤 ❌',
                'partial': '未签退 ⚠️',
                'leave': '请假 🛌',
            };
            const st = statusLabels[rec.status] || '—';
            statusArea.innerHTML = '<div class="att-status info">📋 已有记录 · 状态：<strong>' + st + '</strong></div>';
        } else {
            // No record — allow creation
            _currentRecordId = null;
            _currentStatus = '';
            statusArea.innerHTML = '<div class="att-status info">📭 该日无记录，填入时间后保存将自动创建</div>';
        }

        saveBtn.disabled = false;
    })
    .catch(err => {
        statusArea.innerHTML = '<div class="att-status err">❌ 网络错误</div>';
    });
}

function doSave() {
    const empId = document.getElementById('sel-emp').value;
    const date = document.getElementById('sel-date').value;
    const ci = document.getElementById('input-ci').value;
    const co = document.getElementById('input-co').value;
    const statusArea = document.getElementById('status-area');
    const saveBtn = document.getElementById('save-btn');

    if (!empId || !date) return;

    saveBtn.disabled = true;
    saveBtn.textContent = '⏳ 保存中...';
    statusArea.innerHTML = '<div class="att-status loading">⏳ 保存中...</div>';

    const isLeave = document.getElementById('input-leave').checked;

    fetch('/api/attendance/update', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            employee_id: empId,
            date: date,
            check_in: isLeave ? null : (ci || null),
            check_out: isLeave ? null : (co || null),
            is_leave: isLeave,
        }),
    })
    .then(r => r.json())
    .then(data => {
        if (data.ok) {
            statusArea.innerHTML = '<div class="att-status ok">✅ 已保存！状态已重新计算</div>';
            saveBtn.textContent = '💾 保存';
            saveBtn.disabled = false;
            // Reload to refresh status
            setTimeout(onFieldChange, 500);
        } else {
            statusArea.innerHTML = '<div class="att-status err">❌ ' + data.msg + '</div>';
            saveBtn.textContent = '💾 保存';
            saveBtn.disabled = false;
        }
    })
    .catch(err => {
        statusArea.innerHTML = '<div class="att-status err">❌ 网络错误</div>';
        saveBtn.textContent = '💾 保存';
        saveBtn.disabled = false;
    });
}
</script>
{% endblock %}
