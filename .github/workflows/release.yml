name: Build release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
          - os: ubuntu-latest
            artifact: linux-x64
          - os: macos-15-intel
            artifact: macos-intel
          - os: macos-15
            artifact: macos-apple-silicon
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: attendance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: attendance/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest ../tests
      - run: python build.py
      - run: python smoke_test_release.py
      - run: python archive_release.py
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: attendance/release/*.zip
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
